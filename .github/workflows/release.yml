name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "build_only"
        type: choice
        options:
          - build_only
          - publish_testpypi
          - publish_pypi

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PYO3_PYTHON: python

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dev dependencies
        run: sudo apt-get update && sudo apt-get install -y python3.13-dev

      - name: Install maturin
        run: python -m pip install maturin

      - name: Build wheels (${{ matrix.target }})
        run: maturin build --release --out dist --target ${{ matrix.target }}-unknown-linux-gnu

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build universal2 wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  verify:
    name: Verify Builds
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List built artifacts
        run: ls -la dist/

      - name: Check wheel contents
        run: |
          python -m pip install --upgrade pip wheel
          for whl in dist/*.whl; do
            echo "Checking $whl"
            python -m wheel unpack "$whl" -d /tmp/wheel_check
            ls /tmp/wheel_check
            rm -rf /tmp/wheel_check
          done

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [verify]
    if: |
      startsWith(github.ref, 'refs/tags/') || 
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.release_type != 'build_only')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to TestPyPI
        if: github.event.inputs.release_type == 'publish_testpypi'
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.TESTPYPI_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing --repository testpypi dist/*

      - name: Publish to PyPI
        if: |
          startsWith(github.ref, 'refs/tags/') || 
          github.event_name == 'release' ||
          (github.event_name == 'workflow_dispatch' && inputs.release_type == 'publish_pypi')
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.YJ_NIU }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
