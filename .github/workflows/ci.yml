name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYO3_PYTHON: python

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dev dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python${{ matrix.python-version }}-dev

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install maturin
        run: python -m pip install maturin

      - name: Install rsnumpy
        run: python -m pip install rsnumpy

      - name: Build wheel
        run: maturin build --release --out dist -i python

      - name: Install built wheel
        run: python -m pip install --no-index --find-links dist rspandas

      - name: Run Python smoke test
        run: |
          python -c "
          import rspandas as rpd
          print(f'rspandas version: {rpd.__version__}')
          s = rpd.Series([1, 2, 3, 4, 5])
          print(f'Series: {list(s.values)}')
          print(f'Sum: {s.sum()}')
          df = rpd.DataFrame({'a': [1, 2, 3], 'b': [4, 5, 6]})
          print(f'DataFrame shape: ({df.shape[0]}, {df.shape[1]})')
          print('All smoke tests passed!')
          "
      - name: Install and test (py${{ matrix.python-version }})
        shell: bash
        run: |
          pip install pyarrow
          pip install rsplotlib
          pip install dist/*.whl
          cd testing
          python testing_rspandas1.py
          python testing_rspandas2.py

  rust-lint:
    name: Rust Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dev dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:deadsnakes/ppa
          sudo apt-get update
          sudo apt-get install -y python3.13-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
