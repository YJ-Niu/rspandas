name: Build and Publish Wheels

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------- Linux: x86_64 + aarch64 ----------------
  # manylinux 容器内含全部 CPython，--find-interpreter 自动为每个版本各产出一个 wheel。
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Build wheels (${{ matrix.target }})
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  # ---------------- Windows: x64，按 Python 版本矩阵 ----------------
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Build wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.python-version }}
          path: dist
  # ---------------- macOS: universal2（Intel + Apple Silicon），按版本矩阵 ----------------
  # macos-13(Intel) runner 已退役，改在 arm64 runner 上交叉编译 universal2，
  # 一个 wheel 同时兼容 x86_64 与 arm64，无需 Intel 机器。
  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build universal2 wheel (py${{ matrix.python-version }})
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist -i python

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.python-version }}
          path: dist

  # ---------------- 源码分发（sdist）----------------
  # 当某平台/版本无预编译 wheel 时，pip 可用 sdist 从源码构建（需目标机器有 Rust）。
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # ---------------- 运行测试脚本 ----------------
  # 在所有 wheel 构建完成后、发布到 PyPI 之前运行 testing/testing_rspandas1.py，
  # 用构建产物中安装 rspandas 并执行端到端测试，发布失败时阻止 publish。
  test:
    name: Run testing_rspandas1.py
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Install rspandas and dependencies
        run: |
          python -m pip install --upgrade pip
          # 安装测试脚本所需的 Python 依赖
          pip install rsnumpy rsplotlib
          # 优先安装本次构建的 cp313 wheel，失败则回退到 sdist 或 PyPI
          WHEEL=$(find dist -name 'rspandas-*-cp313-*linux*x86_64*.whl' | head -n 1)
          if [ -n "$WHEEL" ]; then
            echo "Installing wheel: $WHEEL"
            pip install "$WHEEL"
          else
            echo "No cp313 linux wheel found, falling back to sdist/PyPI"
            pip install rspandas
          fi

      - name: Run testing_rspandas1.py
        run: |
          cd testing
          python testing_rspandas1.py

  # ---------------- 发布到 PyPI（仅标签 / Release 触发）----------------

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [linux, windows, macos, sdist, test]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: PyO3/maturin-action@v1
        env:
          # 仓库 Settings → Secrets and variables → Actions 中的 secret 名（值为 PyPI token，以 pypi- 开头）。
          MATURIN_PYPI_TOKEN: ${{ secrets.YJ_NIU }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
