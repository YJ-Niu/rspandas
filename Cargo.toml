[package]
name = "rspandas"
version = "2.0.8"
edition = "2024"

[lib]
name = "rspandas"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dependencies]
pyo3 = { version = "0.29.2" }
csv = "1.4.0"
rayon = "1.12.0"
calamine = "0.36.1"
rust_xlsxwriter = "0.97.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
