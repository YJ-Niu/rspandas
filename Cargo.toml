[package]
name = "rspandas"
version = "2.0.9"
edition = "2024"

[lib]
name = "rspandas"
crate-type = ["cdylib", "rlib"]
path = "rust/src/lib.rs"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[dependencies]
pyo3 = { version = "0.29.2" }
csv = "1.4.0"
rayon = "1.12.0"
calamine = "0.36.1"
rust_xlsxwriter = "0.97.1"
# Arrow + Parquet: 用于在 Rust 层实现 Parquet/Feather 读写，替代 pyarrow 依赖
# default-features=false 只启用需要的编解码器，控制编译时间和 .so 体积
arrow = { version = "59.2.0", default-features = false, features = ["ipc"] }
parquet = { version = "59.2.0", default-features = false, features = [
    "arrow",
    "snap",
    "flate2-rust_backend",
    "zstd",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

# 第三方依赖用 opt-level="z"（体积优先），rspandas 自身代码保持 opt-level=3（性能优先）。
# 这样在不牺牲自身数据处理性能的前提下，大幅压缩 arrow/parquet 等大依赖的 .so 体积。
[profile.release.package."*"]
opt-level = "z"
